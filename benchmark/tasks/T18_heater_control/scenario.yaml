name: T18_heater_control
version: 1
author: circuitmind
steps:
  - wait-serial: "HEATING"
  - expect-part:
      part-id: led1
      gpio: D2
      state: on
  - set-control:
      part-id: temp1
      control: temperature
      value: 45
  - wait-serial: "READY"
  - expect-part:
      part-id: led1
      gpio: D2
      state: off

name: T18_heater_control
version: 1
author: circuitmind
steps:
  - wait-serial: "HEATING"
  - expect-pin:
      part-id: esp
      name: D2
      value: 1
  - set-control:
      part-id: temp1
      control: temperature
      value: 45
  - wait-serial: "READY"
  - expect-pin:
      part-id: esp
      name: D2
      value: 0

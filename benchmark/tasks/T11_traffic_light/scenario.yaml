name: T11_traffic_light
version: 1
author: circuitmind
steps:
  - wait-serial: "CYCLE"
  - delay: 100ms
  - expect-part:
      part-id: led_r
      gpio: D25
      state: on
  - expect-part:
      part-id: led_y
      gpio: D26
      state: off
  - expect-part:
      part-id: led_g
      gpio: D27
      state: off
  - delay: 1000ms
  - expect-part:
      part-id: led_g
      gpio: D27
      state: on
  - expect-part:
      part-id: led_r
      gpio: D25
      state: off
  - delay: 1000ms
  - expect-part:
      part-id: led_y
      gpio: D26
      state: on
  - expect-part:
      part-id: led_g
      gpio: D27
      state: off

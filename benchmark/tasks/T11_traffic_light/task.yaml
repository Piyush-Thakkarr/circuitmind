id: T11_traffic_light
category: output_basics
board: wokwi-esp32-devkit-v1
prompt: >
  Build a traffic light with three LEDs on the ESP32, each with its own series
  resistor: red on GPIO 25, yellow on GPIO 26, green on GPIO 27. Cycle red for 1
  s, green for 1 s, yellow for 500 ms, forever. After the first full cycle print
  CYCLE to the serial monitor at 115200 baud.
status_line: CYCLE
timeout_ms: 6000
notes: >
  Three outputs with three resistors: six parts, seven wires. Tests that the
  model keeps ids unique and gives every LED its resistor. Timeout is generous
  because the first cycle takes 2.5 s. The scenario also checks the pins after
  CYCLE: red, then green after 1 s, then yellow after another 1 s, and only one
  lit at a time.

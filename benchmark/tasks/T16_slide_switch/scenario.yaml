name: T16_slide_switch
version: 1
author: circuitmind
steps:
  - wait-serial: "MODE=OFF"
  - expect-part:
      part-id: led1
      gpio: D2
      state: off
  - set-control:
      part-id: sw1
      control: value
      value: 1
  - wait-serial: "MODE=ON"
  - expect-part:
      part-id: led1
      gpio: D2
      state: on

name: T16_slide_switch
version: 1
author: circuitmind
steps:
  - wait-serial: "MODE=OFF"
  - expect-pin:
      part-id: esp
      name: D2
      value: 0
  - set-control:
      part-id: sw1
      control: value
      value: 1
  - wait-serial: "MODE=ON"
  - expect-pin:
      part-id: esp
      name: D2
      value: 1

id: T25_stepper_turn
category: actuators
board: wokwi-esp32-devkit-v1
prompt: >
  Connect a bipolar stepper motor with 200 steps per revolution to the ESP32.
  Turn it one full revolution clockwise, then one full revolution back, and
  print DONE to the serial monitor at 115200 baud when both turns are finished.
status_line: DONE
timeout_ms: 8000
notes: >
  Four-wire actuator. The catalogue has no driver board, so the coil ends go to
  four GPIOs and the simulator drives them directly (fine in simulation, a real
  build needs an H-bridge, which the guide should say). Tests coil pairing
  (A+/A- and B+/B- in the right order) and the Stepper library. No pin check:
  the coil pattern left after a move is a library detail, not the requested
  result.

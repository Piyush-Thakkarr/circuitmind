name: T24_tilt_alarm
version: 1
author: circuitmind
steps:
  - wait-serial: "LEVEL"
  - expect-pin:
      part-id: esp
      name: D13
      value: 0
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.7
  - wait-serial: "TILT"
  - expect-pin:
      part-id: esp
      name: D13
      value: 1

name: T24_tilt_alarm
version: 1
author: circuitmind
steps:
  - wait-serial: "LEVEL"
  - expect-part:
      part-id: led1
      gpio: D13
      state: off
  - set-control:
      part-id: imu1
      control: accelX
      value: 0.7
  - wait-serial: "TILT"
  - expect-part:
      part-id: led1
      gpio: D13
      state: on

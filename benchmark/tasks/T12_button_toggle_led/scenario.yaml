name: T12_button_toggle_led
version: 1
author: circuitmind
steps:
  - delay: 500ms
  - expect-part:
      part-id: led1
      gpio: D2
      state: off
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: "LED=ON"
  - expect-part:
      part-id: led1
      gpio: D2
      state: on
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 300ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: "LED=OFF"
  - expect-part:
      part-id: led1
      gpio: D2
      state: off
  - set-control:
      part-id: btn1
      control: pressed
      value: 0

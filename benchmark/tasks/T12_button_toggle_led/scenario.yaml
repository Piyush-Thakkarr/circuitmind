name: T12_button_toggle_led
version: 1
author: circuitmind
steps:
  - delay: 500ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: "LED=ON"
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 300ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - wait-serial: "LED=OFF"
  - set-control:
      part-id: btn1
      control: pressed
      value: 0

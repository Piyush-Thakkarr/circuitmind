name: T17_light_switch
version: 1
author: circuitmind
steps:
  - wait-serial: "LIGHT"
  - expect-pin:
      part-id: esp
      name: D2
      value: 0
  - set-control:
      part-id: ldr1
      control: lux
      value: 10
  - wait-serial: "DARK"
  - expect-pin:
      part-id: esp
      name: D2
      value: 1

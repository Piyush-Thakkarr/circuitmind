name: T17_light_switch
version: 1
author: circuitmind
steps:
  - wait-serial: "LIGHT"
  - expect-part:
      part-id: led1
      gpio: D2
      state: off
  - set-control:
      part-id: ldr1
      control: lux
      value: 10
  - wait-serial: "DARK"
  - expect-part:
      part-id: led1
      gpio: D2
      state: on

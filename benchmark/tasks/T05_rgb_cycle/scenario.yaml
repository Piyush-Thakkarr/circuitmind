name: T05_rgb_cycle
version: 1
author: circuitmind
steps:
  - wait-serial: "RGB"
  - delay: 100ms
  - expect-part:
      part-id: rgb1
      pin: R
      gpio: D25
      state: on
  - expect-part:
      part-id: rgb1
      pin: G
      gpio: D26
      state: off
  - expect-part:
      part-id: rgb1
      pin: B
      gpio: D27
      state: off
  - delay: 300ms
  - expect-part:
      part-id: rgb1
      pin: G
      gpio: D26
      state: on
  - expect-part:
      part-id: rgb1
      pin: R
      gpio: D25
      state: off
  - delay: 300ms
  - expect-part:
      part-id: rgb1
      pin: B
      gpio: D27
      state: on
  - expect-part:
      part-id: rgb1
      pin: G
      gpio: D26
      state: off

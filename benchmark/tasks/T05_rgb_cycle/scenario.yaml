name: T05_rgb_cycle
version: 1
author: circuitmind
steps:
  - wait-serial: "RGB"
  - delay: 100ms
  - expect-pin:
      part-id: esp
      name: D25
      value: 1
  - expect-pin:
      part-id: esp
      name: D26
      value: 0
  - expect-pin:
      part-id: esp
      name: D27
      value: 0
  - delay: 300ms
  - expect-pin:
      part-id: esp
      name: D26
      value: 1
  - expect-pin:
      part-id: esp
      name: D25
      value: 0
  - delay: 300ms
  - expect-pin:
      part-id: esp
      name: D27
      value: 1
  - expect-pin:
      part-id: esp
      name: D26
      value: 0

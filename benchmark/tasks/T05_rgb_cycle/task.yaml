id: T05_rgb_cycle
category: output_basics
board: wokwi-esp32-devkit-v1
prompt: >
  Connect a common-cathode RGB LED to the ESP32 with a resistor on each colour
  pin: red on GPIO 25, green on GPIO 26, blue on GPIO 27. Cycle red, green,
  blue, each for 300 ms. After one full cycle print RGB to the serial monitor at
  115200 baud.
status_line: RGB
timeout_ms: 5000
notes: >
  Tests multi-part wiring: three resistors, four connections to one component,
  common pin to ground. The scenario also checks the pins after RGB: red high
  first, then green, then blue, 300 ms apart.
